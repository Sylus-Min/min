<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);overflow:hidden;position:fixed;inset:0;
--bg1:#fff0f6;--bg2:#e8efff;--panel:rgba(255,255,255,.72);--psolid:#fff;--glass:rgba(255,255,255,.68);--ink:#4a3f5c;--sub:#9b90b0;
--acc:#8f9df5;--acc2:#f5a3c7;--grad:linear-gradient(135deg,#8f9df5,#f5a3c7);
--line:rgba(140,120,180,.16);--shadow:0 10px 28px rgba(150,130,200,.16);--mask:rgba(255,232,244,.5)}
body.t-sweet{--bg1:#fff0f5;--bg2:#ffe0eb;--acc:#ff8fb8;--acc2:#ffc2d4;--grad:linear-gradient(135deg,#ff8fb8,#ffc2d4);--mask:rgba(255,228,238,.58);--ink:#5c3548;--sub:#b0839a;--line:rgba(200,120,150,.14)}
body.t-forest{--bg1:#eef7e9;--bg2:#dceedd;--acc:#6bab7c;--acc2:#a8cf9e;--grad:linear-gradient(135deg,#6bab7c,#a8cf9e);--mask:rgba(232,246,228,.58);--ink:#31473a;--sub:#7c9a84;--line:rgba(90,130,95,.15)}
body.t-jp{--bg1:#fdf6ec;--bg2:#fdeee0;--acc:#e8927c;--acc2:#f3bfa3;--grad:linear-gradient(135deg,#e8927c,#f3bfa3);--mask:rgba(250,240,228,.58);--ink:#54423a;--sub:#a98f80;--line:rgba(180,120,90,.14)}
body.t-cloud{--bg1:#f2f6ff;--bg2:#e4ecfa;--acc:#7ca8f0;--acc2:#a9c8f5;--grad:linear-gradient(135deg,#7ca8f0,#a9c8f5);--mask:rgba(234,240,252,.58);--ink:#3a4258;--sub:#8a94ab;--line:rgba(110,130,180,.14)}
body.t-night{--bg1:#26223e;--bg2:#181430;--panel:rgba(46,42,72,.82);--psolid:#2e2a48;--glass:rgba(48,44,76,.74);--ink:#efeaff;--sub:#9d96c2;--acc:#a78bfa;--acc2:#f0a6ca;--grad:linear-gradient(135deg,#a78bfa,#f0a6ca);--line:rgba(200,190,255,.13);--shadow:0 10px 28px rgba(0,0,0,.35);--mask:rgba(40,36,66,.58)}
#bgfx{position:fixed;inset:0;z-index:0;background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;transition:background .5s}
button{border:none;background:none;font-family:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
img{-webkit-user-select:none;user-select:none}
*::-webkit-scrollbar{width:0;height:0}
.hidden{display:none!important}
/* ---------- 加载页 ---------- */
.loading-screen{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
background:linear-gradient(160deg,#fff7fa,#ffeaf3 35%,#f0e6ff 70%,#dde8ff);background-size:220% 220%;animation:lgFlow 11s ease-in-out infinite;transition:opacity .6s,visibility .6s}
.loading-screen.off{opacity:0;visibility:hidden}
@keyframes lgFlow{0%{background-position:0% 40%}50%{background-position:100% 60%}100%{background-position:0% 40%}}
.petal{position:absolute;top:-36px;pointer-events:none;animation:petalFall linear infinite;opacity:.9;filter:drop-shadow(0 2px 4px rgba(247,180,210,.35))}
.petal.star{animation-name:starFall;text-shadow:0 0 8px rgba(190,170,255,.9),0 0 14px rgba(255,200,230,.6)}
@keyframes petalFall{0%{transform:translateY(-40px) translateX(0) rotate(0);opacity:0}8%{opacity:.95}100%{transform:translateY(112vh) translateX(60px) rotate(320deg);opacity:.75}}
@keyframes starFall{0%{transform:translateY(-40px) translateX(0) rotate(0) scale(.8);opacity:0}10%{opacity:1}100%{transform:translateY(112vh) translateX(-50px) rotate(-180deg) scale(1.1);opacity:.7}}
.ls-icon{font-size:66px;animation:lsFloat 3.4s ease-in-out infinite;filter:drop-shadow(0 8px 22px rgba(247,160,200,.55));z-index:1}
@keyframes lsFloat{50%{transform:translateY(-12px)}}
.ls-title{margin-top:16px;font-size:31px;font-weight:700;letter-spacing:5px;background:linear-gradient(120deg,#f38bb4,#9a8bf5,#7ca8f0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;z-index:1}
.ls-sub{margin-top:8px;font-size:14px;letter-spacing:3px;color:#a48bb5;z-index:1}
.ls-hint{margin-top:26px;font-size:13px;color:#b39ec6;min-height:20px;text-align:center;padding:0 40px;z-index:1}
.lp-btn{margin-top:30px;padding:13px 46px;border-radius:30px;font-size:16px;letter-spacing:2px;color:#fff;background:linear-gradient(135deg,#f38bb4,#9a8bf5);box-shadow:0 10px 26px rgba(200,140,240,.4);animation:lpPulse 2.4s ease-in-out infinite;z-index:1}
@keyframes lpPulse{50%{box-shadow:0 10px 34px rgba(240,140,200,.6);transform:translateY(-2px)}}
/* ---------- 主框架 ---------- */
#app{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column}
.chat-screen{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:var(--mask);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);position:relative;z-index:5}
.duo{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:4px 6px;border-radius:16px;transition:background .2s}
.duo:active{background:rgba(255,255,255,.25)}
.duo-r{flex-direction:row-reverse;text-align:right}
.duo-av{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:25px;background:var(--glass);border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 12px rgba(160,130,200,.25);overflow:hidden}
.duo-av img{width:100%;height:100%;object-fit:cover}
.duo-info{min-width:0}
.dname{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dsign{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px;margin-top:2px}
.duo-x{font-size:16px;flex-shrink:0;filter:saturate(1.4);animation:beat 1.8s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}60%{transform:scale(.95)}}
.hbtn{width:36px;height:36px;border-radius:13px;background:var(--glass);border:1px solid var(--line);font-size:17px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.cpages{flex:1;min-height:0;position:relative}
.cpage{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.cpage.on{display:flex}
/* ---------- 聊天 ---------- */
.chbar{display:flex;align-items:center;justify-content:center;gap:8px;padding:5px 12px;font-size:11.5px;color:var(--sub);background:var(--mask);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.chbar:active{opacity:.7}
#msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 6px;scroll-behavior:smooth}
.sysmsg{text-align:center;margin:10px 0;font-size:11.5px;color:var(--sub)}
.sysmsg span{background:var(--glass);padding:4px 12px;border-radius:12px}
.msg{display:flex;align-items:flex-end;gap:8px;margin:8px 0}
.msg.me{flex-direction:row-reverse}
.mav{width:36px;height:36px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--glass);border:1.5px solid rgba(255,255,255,.7);overflow:hidden;box-shadow:0 3px 8px rgba(150,130,200,.18)}
.mav img{width:100%;height:100%;object-fit:cover}
.mbody{max-width:74%;min-width:0;display:flex;flex-direction:column}
.msg.me .mbody{align-items:flex-end}
.bubble{position:relative;padding:10px 13px;border-radius:18px;font-size:15.5px;line-height:1.55;word-break:break-word;white-space:pre-wrap;background:var(--bth);color:var(--bthf);box-shadow:0 2px 10px rgba(150,130,190,.13)}
.msg:not(.me) .bubble{border-bottom-left-radius:6px}
.msg.me .bubble{background:var(--bme);color:var(--bmef);border-bottom-right-radius:6px}
.bubble::after{content:'';position:absolute;bottom:5px;width:0;height:0;border:7px solid transparent}
.msg:not(.me) .bubble::after{left:-12px;border-right:9px solid var(--btht);border-left-color:transparent;border-top-color:transparent;border-bottom-color:transparent}
.msg.me .bubble::after{right:-12px;border-left:9px solid var(--bmet);border-right-color:transparent;border-top-color:transparent;border-bottom-color:transparent}
.quote{border-left:3px solid currentColor;padding:5px 9px;margin-bottom:7px;border-radius:7px;background:rgba(255,255,255,.36);font-size:12.5px;opacity:.82;line-height:1.45}
.quote b{display:block;font-weight:600;margin-bottom:1px}
body.t-night .quote{background:rgba(0,0,0,.14)}
.msgimg{max-width:200px;max-height:280px;border-radius:14px;display:block;box-shadow:0 4px 14px rgba(150,130,190,.2)}
.msgimg.stk{max-width:130px;max-height:130px;border-radius:16px;box-shadow:none;background:var(--glass);padding:3px}
.mtime{font-size:10.5px;color:var(--sub);margin:3px 5px 0;opacity:.85}
.mfav{position:relative;font-size:12px;margin:0 4px;align-self:center;color:#f5b942}
.typing .bubble{display:flex;gap:5px;align-items:center;padding:13px 15px}
.tdot-i{width:7px;height:7px;border-radius:50%;background:var(--bthf);opacity:.55;animation:tb 1.2s infinite}
.tdot-i:nth-child(2){animation-delay:.2s}.tdot-i:nth-child(3){animation-delay:.4s}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:.95}}
.composer{display:flex;align-items:flex-end;gap:7px;padding:8px 10px;background:var(--mask);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.icon-btn{width:37px;height:37px;border-radius:50%;background:var(--glass);border:1px solid var(--line);font-size:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.icon-btn:active{transform:scale(.9)}
.cp-input{flex:1;min-height:37px;max-height:110px;border-radius:19px;border:1.5px solid var(--line);background:var(--glass);padding:8px 14px;line-height:1.4;outline:none;resize:none;-webkit-appearance:none}
.cp-input:focus{border-color:var(--acc2)}
.send-btn{width:37px;height:37px;border-radius:50%;flex-shrink:0;color:#fff;font-size:18px;font-weight:700;background:var(--grad);box-shadow:0 4px 12px rgba(200,130,220,.35);display:flex;align-items:center;justify-content:center}
.qbar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--mask);backdrop-filter:blur(12px);border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
.qbar .qx{margin-left:auto;font-size:15px;padding:0 4px}
.panel{max-height:242px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px calc(10px + env(safe-area-inset-bottom)*0);background:var(--mask);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.ptabs{display:flex;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.ptab{padding:5px 14px;border-radius:15px;font-size:13px;background:var(--glass);border:1px solid var(--line);color:var(--sub)}
.ptab.on{background:var(--grad);color:#fff;border-color:transparent}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.emoji-grid button{font-size:23px;padding:5px 0;border-radius:9px}
.emoji-grid button:active{background:var(--glass)}
.kao-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kao-grid button{font-size:14.5px;padding:9px 4px;border-radius:11px;background:var(--glass);border:1px solid var(--line);white-space:nowrap;overflow:hidden}
.stk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stk-grid button{border-radius:12px;background:var(--glass);border:1px solid var(--line);padding:3px}
.stk-grid img{width:100%;height:64px;object-fit:cover;border-radius:9px}
.panel-note{text-align:center;color:var(--sub);font-size:12.5px;padding:14px 0}
/* ---------- 说说 ---------- */
.feed-top{padding:10px 12px;background:var(--mask);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.ft-avrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ft-avpick{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-size:13px}
.ft-avpick.on{background:var(--grad);color:#fff;border-color:transparent}
.ft-avpick .fp-av{width:22px;height:22px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden}
.ft-avpick .fp-av img{width:100%;height:100%;object-fit:cover}
.ft-text{width:100%;border-radius:14px;border:1.5px solid var(--line);background:var(--glass);padding:9px 12px;min-height:44px;max-height:110px;resize:none;outline:none;line-height:1.5}
.ft-imgs{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.ft-imgs .fim{position:relative;width:56px;height:56px;border-radius:10px;overflow:hidden;border:1.5px solid var(--line)}
.ft-imgs .fim img{width:100%;height:100%;object-fit:cover}
.ft-imgs .fim .fx{position:absolute;top:1px;right:1px;width:17px;height:17px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.ft-add{width:56px;height:56px;border-radius:10px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--sub);background:var(--glass)}
.ft-acts{display:flex;align-items:center;justify-content:space-between}
.ft-cnt{font-size:11.5px;color:var(--sub)}
#feedList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
.fpost{background:var(--panel);backdrop-filter:blur(10px);border-radius:18px;padding:13px 14px;margin-bottom:12px;box-shadow:var(--shadow);position:relative}
.fhead{display:flex;align-items:center;gap:10px}
.favt{width:38px;height:38px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--glass);border:1.5px solid rgba(255,255,255,.7);overflow:hidden}
.favt img{width:100%;height:100%;object-fit:cover}
.fname{font-size:14px;font-weight:700}
.ftime{font-size:11px;color:var(--sub);margin-top:1px}
.fdel{position:absolute;top:10px;right:12px;color:var(--sub);font-size:13px;padding:4px 6px;opacity:.7}
.ftext{margin:9px 0 2px;font-size:15px;line-height:1.62;white-space:pre-wrap;word-break:break-word}
.fimgs{display:grid;gap:6px;grid-template-columns:repeat(3,1fr);margin-top:8px}
.fimgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.fimgs.one img{grid-column:span 2;aspect-ratio:4/3}
.fimgs.two{grid-template-columns:repeat(2,1fr)}
.facts{display:flex;gap:20px;margin-top:11px;color:var(--sub);font-size:13.5px}
.fact{display:flex;align-items:center;gap:5px;padding:3px 6px;border-radius:12px}
.fact:active{background:var(--glass)}
.fact.on{color:#ff7aa8}
.fcomments{margin-top:10px;background:rgba(150,130,190,.09);border-radius:12px;padding:8px 11px;font-size:13.5px}
body.t-night .fcomments{background:rgba(0,0,0,.18)}
.fcm{margin:6px 0;line-height:1.55;word-break:break-word}
.fcm .cname{color:var(--acc);font-weight:600}
.fcm .rpat{color:var(--acc2)}
.fcm .cmtx{color:var(--sub);font-size:11.5px;margin-left:6px}
.fcm .cmimg{max-width:92px;max-height:92px;border-radius:9px;vertical-align:middle;margin-top:3px;display:block}
.fcm .cmdel{float:right;color:var(--sub);font-size:12px;padding:0 3px;opacity:.75}
/* ---------- 电子信 ---------- */
.ltabs{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--mask);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.ltab{flex:1;padding:8px 0;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-size:13.5px;color:var(--sub);position:relative}
.ltab.on{background:var(--grad);color:#fff;border-color:transparent}
.ltab-add{width:38px;height:36px;border-radius:13px;background:var(--grad);color:#fff;font-size:17px;flex-shrink:0}
.lbadge{display:inline-flex;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#ff5f7a;color:#fff;font-size:10.5px;align-items:center;justify-content:center;vertical-align:2px;margin-left:3px}
#letterList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
.lcard{background:var(--panel);backdrop-filter:blur(10px);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow);position:relative}
.lcard.unread::after{content:'';position:absolute;top:12px;right:12px;width:9px;height:9px;border-radius:50%;background:#ff5f7a;box-shadow:0 0 0 3px rgba(255,95,122,.2)}
.ltop{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.ltop .lfrom{color:var(--acc);font-weight:600}
.ltitle{font-size:15px;font-weight:700;margin:5px 0 3px}
.lexcerpt{font-size:12.5px;color:var(--sub);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ltime{font-size:11px;color:var(--sub);margin-top:6px}
.ldel{position:absolute;bottom:11px;right:12px;color:var(--sub);font-size:12.5px;opacity:.8;padding:3px 5px}
.lp-list{display:flex;flex-direction:column;gap:6px;margin:8px 0;max-height:200px;overflow-y:auto}
.lp-item{display:flex;align-items:flex-start;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:11px;padding:8px 10px;font-size:14px;line-height:1.5;word-break:break-word}
.lp-item img{max-width:80px;max-height:80px;border-radius:8px}
.lp-item .lpx{margin-left:auto;color:var(--sub);font-size:13px;flex-shrink:0}
.lview{background:var(--panel);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.lview .lv-title{text-align:center;font-size:17px;font-weight:700;margin-bottom:2px}
.lview .lv-meta{text-align:center;font-size:11.5px;color:var(--sub);margin-bottom:12px}
.lview .lv-part{font-size:15px;line-height:1.8;margin:8px 0;white-space:pre-wrap;word-break:break-word}
.lview img.lv-img{max-width:100%;border-radius:12px;margin:8px 0;box-shadow:0 4px 14px rgba(150,130,190,.18)}
.lview .lv-sep{text-align:center;color:var(--acc2);letter-spacing:8px;margin:10px 0}
/* ---------- 占卜 ---------- */
.divi-tabs{display:flex;gap:8px;padding:10px 12px 0}
.dtab{flex:1;padding:9px 0;border-radius:14px;background:var(--glass);border:1px solid var(--line);font-size:13.5px;color:var(--sub)}
.dtab.on{background:var(--grad);color:#fff;border-color:transparent}
.draw-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;display:flex;flex-direction:column}
.dpick{display:flex;flex-direction:column;align-items:center;gap:10px;padding:36px 0}
.dpick .big{font-size:64px;animation:lsFloat 3s ease-in-out infinite;filter:drop-shadow(0 8px 18px rgba(167,139,250,.4))}
.dpick p{font-size:13.5px;color:var(--sub);text-align:center;line-height:1.7;padding:0 26px}
.dcards{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:18px 0}
.dcard{width:86px;height:130px;perspective:640px}
.dcard-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .65s}
.dcard.flip .dcard-inner{transform:rotateY(180deg)}
.dface{position:absolute;inset:0;border-radius:13px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px}
.dback{background:var(--grad);color:#fff;font-size:30px;box-shadow:var(--shadow)}
.dfront{background:var(--psolid);transform:rotateY(180deg);border:1.5px solid var(--line);box-shadow:var(--shadow)}
.dfront .de{font-size:32px}
.dfront .dnm{font-size:10.5px;color:var(--sub);margin-top:7px;text-align:center;line-height:1.4}
.dres{background:var(--panel);backdrop-filter:blur(8px);border-radius:16px;padding:14px 15px;margin-top:8px;box-shadow:var(--shadow)}
.dres h5{font-size:15px;margin-bottom:8px}
.dres p{font-size:14px;line-height:1.75;margin:5px 0}
.dres .dk{color:var(--acc);font-weight:600}
/* ---------- 底部标签栏 ---------- */
.chat-tabbar{display:flex;background:var(--mask);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px 6px calc(env(safe-area-inset-bottom) + 12px);position:relative;z-index:5}
.tbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 3px;color:var(--sub);font-size:12px;position:relative;transition:color .2s,transform .2s}
.tbtn .ti{font-size:22px;line-height:1.15;transition:transform .25s}
.tbtn.on{color:var(--acc)}
.tbtn.on .ti{transform:translateY(-2px) scale(1.08)}
.tbadge{position:absolute;top:1px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:#ff5f7a;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.tdot{position:absolute;top:4px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:#ff5f7a}
/* ---------- 加号面板 / 模态框 / 菜单 ---------- */
.sheet-mask{position:fixed;inset:0;z-index:130;background:rgba(60,40,80,.28);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:131;background:var(--glass);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-radius:26px 26px 0 0;padding:10px 14px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.85,.25,1);box-shadow:0 -8px 40px rgba(120,90,160,.25)}
.sheet.on{transform:none}
.sheet-grip{width:42px;height:4.5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.sbtn{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;color:var(--ink)}
.sic{width:54px;height:54px;border-radius:19px;background:var(--glass);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:25px;box-shadow:var(--shadow)}
.sbtn:active .sic{transform:scale(.92)}
.modal-mask{position:fixed;inset:0;z-index:140;background:var(--mask);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-mask.on{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:380px;max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--glass);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid rgba(255,255,255,.65);border-radius:22px;padding:18px 16px;box-shadow:var(--shadow);transform:scale(.92) translateY(10px);transition:transform .25s}
body.t-night .modal{border-color:rgba(255,255,255,.14)}
.modal-mask.on .modal{transform:none}
.mtitle{font-size:16.5px;font-weight:700;margin-bottom:12px;text-align:center}
.ctx{position:fixed;z-index:150;background:var(--glass);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.6);border-radius:16px;box-shadow:var(--shadow);padding:6px;display:flex;gap:2px;max-width:94vw;animation:ctxIn .18s ease-out}
body.t-night .ctx{border-color:rgba(255,255,255,.14)}
@keyframes ctxIn{from{opacity:0;transform:scale(.85)}}
.ctx-item{padding:9px 13px;border-radius:12px;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:5px}
.ctx-item:active{background:var(--line)}
.ctx-item.warn{color:#ff5f7a}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:210;background:rgba(60,45,80,.88);color:#fff;padding:10px 20px;border-radius:20px;font-size:13.5px;opacity:0;pointer-events:none;transition:.3s;max-width:82vw;text-align:center;backdrop-filter:blur(8px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- 子页面通用 ---------- */
.subpage{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.25,.8,.3,1);visibility:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2))}
.subpage.on{transform:none;visibility:visible}
.sub-head{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;background:var(--mask);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.back-btn{width:34px;height:34px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sub-title{font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(110px + env(safe-area-inset-bottom))}
.card{background:var(--panel);backdrop-filter:blur(10px);border-radius:18px;padding:14px 15px;margin-bottom:13px;box-shadow:var(--shadow)}
.sec-title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sec-title .st-r{margin-left:auto;font-size:12px;color:var(--sub);font-weight:400}
.row{display:flex;align-items:center;gap:10px}
.row .rgrow{margin-left:auto;display:flex;gap:8px;align-items:center;flex-shrink:0}
.lb{font-size:13.5px;color:var(--sub)}
.sv{font-size:13px;font-weight:600;color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:10px 18px;border-radius:15px;font-size:14px;background:var(--glass);border:1px solid var(--line);color:var(--ink)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(190,130,220,.3)}
.btn.danger{background:rgba(255,95,122,.12);color:#ff5f7a;border-color:rgba(255,95,122,.3)}
.btn.sm,.small-btn{padding:6px 13px;border-radius:12px;font-size:12.5px}
.btn.block{width:100%}
.field{margin-bottom:11px}
.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px}
.ipt{width:100%;border-radius:13px;border:1.5px solid var(--line);background:var(--glass);padding:10px 13px;outline:none;font-size:16px;line-height:1.5}
.ipt:focus{border-color:var(--acc2)}
textarea.ipt{resize:none;min-height:76px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chip{flex-shrink:0;padding:7px 15px;border-radius:16px;background:var(--glass);border:1px solid var(--line);font-size:13.5px;color:var(--sub);display:flex;align-items:center;gap:5px}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.chip-add{border-style:dashed}
.chip .cnum{font-size:10.5px;opacity:.75}
.seg{display:flex;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg-btn{flex:1;padding:7px 0;border-radius:11px;font-size:13px;color:var(--sub)}
.seg-btn.on{background:var(--grad);color:#fff}
.switch{width:46px;height:27px;border-radius:14px;background:var(--line);position:relative;transition:.25s;flex-shrink:0}
.switch.on{background:var(--grad)}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.switch.on::after{left:22px}
.slider-row{display:flex;align-items:center;gap:12px;padding:9px 0}
.slider-row input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:23px;height:23px;border-radius:50%;background:#fff;border:2.5px solid var(--acc);box-shadow:0 2px 8px rgba(150,130,200,.35)}
.empty{text-align:center;color:var(--sub);font-size:13.5px;padding:34px 0;line-height:1.8}
.empty .em-e{font-size:38px;display:block;margin-bottom:6px;opacity:.75}
/* ---------- 字卡管理 ---------- */
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.citem{background:var(--glass);border:1px solid var(--line);border-radius:13px;padding:9px 10px;font-size:14px;line-height:1.5;display:flex;align-items:center;gap:6px;word-break:break-all;position:relative;min-height:48px}
.citem img{width:44px;height:44px;object-fit:cover;border-radius:9px;flex-shrink:0}
.citem .ci-t{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.citem .cix{position:absolute;top:4px;right:6px;color:var(--sub);font-size:12px;padding:2px}
.citem .cif{position:absolute;bottom:4px;right:6px;font-size:11px;color:#f5b942;opacity:.35}
.citem .cif.on{opacity:1}
.own-tag{font-size:9.5px;padding:1.5px 6px;border-radius:7px;flex-shrink:0;background:var(--line);color:var(--sub)}
.own-tag.char{background:rgba(167,139,250,.18);color:#8f6fd8}
.own-tag.me{background:rgba(245,163,199,.2);color:#e0729e}
/* ---------- 日历 ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h4{font-size:16px}
.cal-nav{width:34px;height:34px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:15px;display:flex;align-items:center;justify-content:center}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11.5px;color:var(--sub);margin-bottom:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14.5px;position:relative;border:1.5px solid transparent}
.cal-cell.dim{opacity:.28}
.cal-cell.today{border-color:var(--acc2);font-weight:700}
.cal-cell.sel{background:var(--grad);color:#fff}
.cal-dot{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:#ff7aa8}
.cal-cell.sel .cal-dot{background:#fff}
.evcard{background:var(--panel);border-radius:14px;padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow);position:relative}
.evcard .evd{font-size:11.5px;color:var(--acc);font-weight:600}
.evcard h5{font-size:14.5px;margin:3px 0}
.evcard p{font-size:13px;color:var(--sub);line-height:1.6;white-space:pre-wrap}
.evcard .evx{position:absolute;top:8px;right:10px;color:var(--sub);font-size:12px}
/* ---------- 状态/心情 ---------- */
.stcard{display:flex;gap:12px;align-items:flex-start}
.st-av{width:54px;height:54px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--glass);border:2px solid rgba(255,255,255,.8);flex-shrink:0;overflow:hidden}
.st-av img{width:100%;height:100%;object-fit:cover}
.st-name{font-size:15px;font-weight:700}
.st-status{font-size:13.5px;color:var(--sub);margin:4px 0 8px;line-height:1.5}
.wxchip{display:inline-flex;align-items:center;gap:5px;background:var(--glass);border:1px solid var(--line);border-radius:13px;padding:5px 11px;font-size:12.5px;color:var(--sub)}
.mood-cur{display:flex;align-items:center;gap:10px;background:var(--glass);border-radius:15px;padding:11px 13px}
.mood-cur .mc-e{font-size:34px}
.mood-cur .mc-t{font-size:14px;font-weight:600}
.mood-cur .mc-s{font-size:11.5px;color:var(--sub);margin-top:2px}
.mh-item{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:13.5px}
.mh-item:last-child{border-bottom:none}
.mh-item .mh-e{font-size:20px}
.mh-item .mh-t{flex:1;min-width:0}
.mh-item .mh-s{font-size:10.5px;color:var(--sub)}
/* ---------- 气泡/主题选择 ---------- */
.bub-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bub-item{background:var(--glass);border:1.5px solid var(--line);border-radius:16px;padding:11px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.bub-item.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(167,139,250,.18)}
.bub-item .bnm{font-size:12.5px;color:var(--sub)}
.bub-prev{padding:9px 14px;border-radius:15px;font-size:14px;max-width:86%;position:relative;box-shadow:0 2px 8px rgba(150,130,190,.15)}
.bub-prev.r{border-bottom-right-radius:5px}
.bub-prev.l{border-bottom-left-radius:5px}
.bg-swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.bgsw{aspect-ratio:1.55;border-radius:14px;border:2px solid var(--line);position:relative;overflow:hidden}
.bgsw.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(167,139,250,.2)}
.bgsw span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.28);color:#fff;font-size:10.5px;text-align:center;padding:3px 0}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.th-card{border-radius:16px;overflow:hidden;border:2px solid var(--line);background:var(--glass)}
.th-card.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(167,139,250,.2)}
.th-prev{height:56px;position:relative}
.th-prev .tp-dot{position:absolute;width:15px;height:15px;border-radius:50%}
.th-name{font-size:12px;text-align:center;padding:6px 2px;color:var(--ink)}
/* ---------- 收藏/备份 ---------- */
.favtab{display:flex;gap:8px;margin-bottom:12px}
.mod-row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px dashed var(--line)}
.mod-row:last-child{border-bottom:none}
.mod-ic{font-size:21px;width:34px;text-align:center;flex-shrink:0}
.mod-name{font-size:14px;flex:1;min-width:0}
.mod-name small{display:block;color:var(--sub);font-size:11px;margin-top:1px}
.store-bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.store-bar i{display:block;height:100%;background:var(--grad);border-radius:5px;transition:width .5s}
/* ---------- 通话 ---------- */
.call-screen{position:fixed;inset:0;z-index:160;background:linear-gradient(165deg,#43356e,#241d42 60%,#191333);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff}
.call-av{width:108px;height:108px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:52px;overflow:hidden;box-shadow:0 0 0 12px rgba(255,255,255,.07),0 0 60px rgba(167,139,250,.5);animation:callPulse 2.4s infinite}
.call-av img{width:100%;height:100%;object-fit:cover}
@keyframes callPulse{50%{box-shadow:0 0 0 22px rgba(255,255,255,.04),0 0 86px rgba(240,166,202,.55)}}
.call-name{font-size:21px;font-weight:700;margin-top:8px}
.call-sub{opacity:.72;font-size:13px}
.call-timer{font-size:15px;letter-spacing:2px;opacity:.9;margin-top:4px}
.call-acts{display:flex;gap:28px;margin-top:36px}
.call-btn{width:64px;height:64px;border-radius:50%;font-size:26px;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.call-btn.end{background:linear-gradient(135deg,#ff7d95,#ff5f7a)}
.call-btn:active{transform:scale(.92)}
/* ---------- 通用小件 ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.tc{text-align:center}.mut{color:var(--sub);font-size:12.5px;line-height:1.7}
.hint{font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:8px}
.preview-img-wrap{text-align:center}
.preview-img-wrap img{max-width:100%;max-height:56vh;border-radius:14px}
</style>
</head>

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

const pad2=n=>String(n).padStart(2,'0');
const todayStr=(t=new Date())=>`${t.getFullYear()}-${pad2(t.getMonth()+1)}-${pad2(t.getDate())}`;
const fmtTime=ts=>{const d=new Date(ts);return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`};
const fmtDT=ts=>{const d=new Date(ts);return `${d.getMonth()+1}月${d.getDate()}日 ${pad2(d.getHours())}:${pad2(d.getMinutes())}`};
const fmtDay=ts=>{const d=new Date(ts),n=new Date();return todayStr(d)===todayStr(n)?'今天':(todayStr(new Date(n-864e5))===todayStr(d)?'昨天':`${d.getMonth()+1}月${d.getDate()}日`)};
const ago=ts=>{const s=(Date.now()-ts)/1e3;if(s<60)return'刚刚';if(s<3600)return Math.floor(s/60)+'分钟前';if(s<86400)return Math.floor(s/3600)+'小时前';return fmtDay(ts)};

/* ============ IndexedDB 存储（无大小限制）+ localStorage 兜底 ============ */
const DB=(()=>{
  let db=null,ok=false;
  const open=()=>new Promise(res=>{
    let done=false;const fin=v=>{if(!done){done=true;res(v)}};
    try{
      const rq=indexedDB.open('dreamtxDB',1);
      rq.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};
      rq.onsuccess=()=>{db=rq.result;ok=true;fin(true)};
      rq.onerror=()=>fin(false);rq.onblocked=()=>fin(false);
      setTimeout(()=>fin(false),2500);
    }catch(e){fin(false)}
  });
  const iget=k=>new Promise((res,rej)=>{try{const q=db.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});
  const iset=(k,v)=>new Promise((res,rej)=>{try{const q=db.transaction('kv','readwrite').objectStore('kv').put(v,k);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)}catch(e){rej(e)}});
  return{
    open,
    get ok(){return ok},
    /* 读取时比较 IndexedDB 与 localStorage 两份副本的保存时间，取更新的那份，
       避免某一层写入被浏览器中断（如页面卸载时 IDB 事务被中止）导致旧数据覆盖新数据 */
    async get(k,d){
      let a,b;
      if(ok){try{a=await iget(k)}catch(e){a=undefined}}
      try{const r=localStorage.getItem(k);if(r!=null)b=JSON.parse(r)}catch(e){b=undefined}
      if(a===undefined&&b===undefined)return d;
      const ta=(a&&typeof a==='object'&&a._savedAt)||0;
      const tb=(b&&typeof b==='object'&&b._savedAt)||0;
      if(a!==undefined&&(ta>=tb||b===undefined))return a;
      if(b!==undefined)return b;
      return d;
    },
    async set(k,v){
      if(v&&typeof v==='object')v._savedAt=Date.now();
      if(ok){try{await iset(k,v)}catch(e){}}
      try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}
    },
    async del(k){if(ok){try{db.transaction('kv','readwrite').objectStore('kv').delete(k)}catch(e){}}try{localStorage.removeItem(k)}catch(e){}}
  };
})();

  return d;

const TAROT=buildTarot();
function readingFor(cards){
  const names=cards.map(c=>c.n).join(',');
  let best=null,bs=0;
  READINGS.forEach(r=>{r.k.split('|').forEach(k=>{if(names.includes(k)){const s=cards.filter(c=>c.n===k).length*3+(r.k.split('|').filter(x=>names.includes(x)).length);if(s>bs){bs=s;best=r}}})});
  return best||pick(READINGS);
}

/* ============ v1 → v2 迁移 ============ */
async function migrateV1(){
  let raw=null;try{raw=localStorage.getItem('dreamtx_data_v1')}catch(e){}
  if(!raw)return null;
  let d;try{d=JSON.parse(raw)}catch(e){return null}
  if(!d||d.v!==1)return null;
  const st=defaultState();
  let hasCustom=false;
  (d.items||[]).forEach(it=>{
    const isImg=it.type==='sticker'||it.type==='custom'||/data:image|\.(png|jpe?g|gif|webp)/i.test(it.content||'');
    st.items.push({id:uid(),kind:isImg?'img':'text',gid:isImg?'g_stk':'g_mig',owner:'common',content:it.content||'',fav:!!it.fav});
    if(!isImg)hasCustom=true;
  });
  if(hasCustom)st.groups.push({id:'g_mig',name:'导入的字卡',icon:'📥'});
  st.msgs=(d.msgs||[]).map(m=>({id:uid(),side:m.side||'me',kind:m.kind==='img'||m.kind==='card'&&/data:image/.test(m.content||'')?'img':'text',content:m.content||'',ts:m.ts||Date.now(),quote:null,recalled:false,fav:false}));
  st.feed=(d.feed||[]).map(f=>({id:uid(),side:f.side||'me',text:f.text||'',imgs:f.imgs||[],ts:f.ts||Date.now(),likes:{me:!!f.liked,char:false},comments:(f.comments||[]).map(c=>({id:uid(),side:'char',text:String(c),img:'',ts:f.ts||Date.now(),replyTo:null}))}));
  st.letters=(d.letters||[]).map(l=>({id:uid(),side:l.side||'char',title:l.title||'一封旧信',parts:Array.isArray(l.parts)?l.parts:[{kind:'text',content:l.text||''}],ts:l.ts||Date.now(),read:true}));
  st.moods.me=(d.moods||[]).map(m=>({emoji:m.emoji||'🌙',text:m.text||'',ts:m.ts||Date.now()}));
  st.events=(d.events||[]).map(e=>({date:e.date||todayStr(),title:e.title||'备忘',text:e.text||e.content||''}));
  if(d.status)st.status.me={text:d.status.text||st.status.me.text,emoji:d.status.emoji||'💗'};
  if(d.char&&d.char.name)st.char.name=d.char.name;
  if(d.char&&d.char.avatar&&!d.char.img)st.char.avatar=d.char.avatar;
  if(d.me&&d.me.name)st.me.name=d.me.name;
  if(d.me&&d.me.avatar&&!d.me.img)st.me.avatar=d.me.avatar;
  if(d.settings&&d.settings.theme==='night')st.settings.theme='t-night';
  return st;
}

let S=null,saveTimer=null,_lastSync=0;
function _lsSync(){
  try{S._savedAt=Date.now();localStorage.setItem(DKEY,JSON.stringify(S));_lastSync=Date.now()}catch(e){}

/* ============ 图片选择与压缩 ============ */
function pickImageFile(cb,max=720){
  const f=$('#filePick');f.value='';
  f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=async()=>{cb(await compressImg(r.result,max))};r.readAsDataURL(file)};
  f.click();
}
function compressImg(src,max=720,q=.85){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      if(/^data:image\/gif/i.test(src)){res(src);return}
      let w=img.width,h=img.height;const sc=Math.min(1,max/Math.max(w,h));
      w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
      try{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q))}
      catch(e){res(src)}
    };
    img.onerror=()=>res(src);
    img.src=src;
  });
}
function downloadFile(name,content){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:'application/octet-stream'}));
  a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600);
}
function pickDataFile(cb){
  const f=$('#dataPick');f.value='';
  f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>cb(r.result,file.name);r.readAsText(file)};
  f.click();
}

/* ============ 回复引擎（字卡库驱动） ============ */
function libPool(owner,kind){
  return S.items.filter(i=>i.kind===kind&&(i.owner===owner||i.owner==='common'));
}
function buildCharText(){
  const pool=libPool('char','text');
  const short=pool.filter(i=>i.content&&i.content.length<=18);
  const use=short.length>=4?short:(pool.length>=4?pool:null);
  if(!use){
    const base=pick([pick(KAO),pick(EMOJI_ALL),pick(EMOJI_ALL)+' '+pick(KAO)]);
    return base;
  }
  const k=Math.random()<.5?1:(Math.random()<.75?2:3);
  const parts=[];const used=new Set();
  for(let j=0;j<k;j++){let c,tries=0;do{c=pick(use);tries++}while(used.has(c.id)&&tries<8);used.add(c.id);parts.push(c.content)}
  let txt=parts.join(' ');
  if(Math.random()<.22)txt+=' '+pick(KAO);
  return txt;
}
function deliverChatMsg(){
  const stk=libPool('char','img');
  if(stk.length&&Math.random()<.16){
    const c=pick(stk);
    S.msgs.push({id:uid(),side:'char',kind:'img',stk:true,content:c.content,ts:Date.now(),quote:null,recalled:false,fav:false});
  }else{
    S.msgs.push({id:uid(),side:'char',kind:'text',content:buildCharText(),ts:Date.now(),quote:null,recalled:false,fav:false});
  }
  if(curCp!=='cp-chat')S.chatUnread++;
  updateBadges();
}
function scheduleChatReply(){
  const st=S.settings;
  let delay=st.replyDelay;
  if(delay>20)delay=Math.round(delay*rnd(75,125)/100);
  if(delay<1)delay=rnd(1,3);
  const n=rnd(1,st.replyCount);
  if(S.pending.chat)S.pending.chat.count=Math.min(8,S.pending.chat.count+n);
  else S.pending.chat={dueAt:Date.now()+delay*1000,count:n};
  save();
}
/* 定时心跳：投递延迟消息 / 回信 / 说说互动 */
function tick(){
  if(!S)return;
  const now=Date.now();let dirty=false,chatDirty=false,feedDirty=false,letterDirty=false;
  const p=S.pending;
  if(p.chat&&now>=p.chat.dueAt){
    deliverChatMsg();p.chat.count--;chatDirty=true;
    if(p.chat.count>0)p.chat.dueAt=now+rnd(S.settings.replyGapMin,S.settings.replyGapMax)*1000;
    else p.chat=null;
    dirty=true;
  }
  for(let i=p.letters.length-1;i>=0;i--){
    if(now>=p.letters[i].dueAt){deliverLetter('char');p.letters.splice(i,1);dirty=true;letterDirty=true}
  }
  for(let i=p.feed.length-1;i>=0;i--){
    if(now>=p.feed[i].dueAt){doFeedEvent(p.feed[i]);p.feed.splice(i,1);dirty=true;feedDirty=true}
  }
  if(S.settings.proactive&&S.settings.nextProactive&&now>=S.settings.nextProactive){
    deliverLetter('char',true);
    scheduleProactive();dirty=true;letterDirty=true;
  }
  if(chatDirty&&curCp==='cp-chat'){renderMsgs();scrollMsgs()}
  if(feedDirty&&curCp==='cp-feed')renderFeed();
  if(letterDirty&&curCp==='cp-letter')renderLetters();
  if(dirty){updateBadges();save()}
  else if(p.chat&&curCp==='cp-chat'&&p.chat.dueAt-now<4600&&p.chat.dueAt-now>3200)renderMsgs();
}
function scheduleProactive(){
  const h=S.settings.proactiveGap;
  S.settings.nextProactive=Date.now()+rnd(Math.round(h*36e5*.7),Math.round(h*36e5*1.3));
}

function sendLetter(){

  const due=h>0?Date.now()+rnd(Math.round(h*36e5*.25),h*36e5):Date.now()+rnd(4,12)*1000;
  S.pending.letters.push({dueAt:due});

function buildLetterParts(){
  const n=Math.max(1,Math.min(30,rnd(Math.ceil(S.settings.letterParts/2)||1,S.settings.letterParts)));
  const pool=libPool('char','text');
  const parts=[];
  const opener=pick(['见信好呀，','展信安，','今天也想跟你说，','偷偷告诉你，','这封信写了很久，']);
  parts.push({kind:'text',content:opener});
  for(let i=0;i<n-1;i++){
    if(Math.random()<.18){
      const stks=libPool('char','img');
      if(stks.length){parts.push({kind:'img',content:pick(stks).content});continue}
    }
    if(pool.length>=3&&Math.random()<.5)parts.push({kind:'text',content:pick(pool).content});
    else parts.push({kind:'text',content:pick(['最近有好好吃饭吗？','今天路过一家奶茶店，想到你了。','梦里好像见到你了。','你上次说的话我还在想。','天气转凉了，记得添衣服。','我这边今晚的月亮很圆。','有点想你，就写信告诉你。','最近在听一首歌，想放给你听。','希望你今天过得开心。','等忙完这阵，我们见一面吧。','你笑起来的时候，我总觉得世界很温柔。','没什么事，就是想跟你说说话。'])});
  }
  parts.push({kind:'text',content:pick(['——永远在你身边的 '+S.char.name,'想你的 '+S.char.name,'祝好梦。','勿念，我很好。','期待你的回信。'])});

/* 宽容解析：兼容各种来源的 JSON / CSV / TXT */
function cleanCsv(s){
  s=String(s).trim();
  const m=s.match(/^"([\s\S]*)"(,*)$/);
  if(m)return m[1].replace(/""/g,'"').trim();
  return s.replace(/,+\s*$/,'').trim();
}
function extractCards(x,out){
  if(x==null)return;
  if(typeof x==='string'){if(x.trim())out.push(x.trim());return}
  if(typeof x==='number'){out.push(String(x));return}
  if(Array.isArray(x)){x.forEach(v=>extractCards(v,out));return}
  if(typeof x==='object'){
    const c=x.content??x.text??x.word??x.val??x.value??x.name??x.title??x.msg??x.reply??x.label??x.q??x.k;
    if(typeof c==='string'&&c.trim()){out.push(c.trim());return}
    if(typeof c==='number'){out.push(String(c));return}
    const u=x.url??x.img??x.image??x.src??x.icon;
    if(typeof u==='string'&&isImgContent(u)){out.push(u);return}
    if(Array.isArray(x.options)){x.options.forEach(v=>extractCards(v,out));return}
    if(x.emotion&&x.answer){out.push(String(x.emotion),String(x.answer));return}
  }
}
/* 识别「聊天助手」等 App 的备份：data.wordCardsStructure(字卡) + globalStickers(base64表情) */
function parseAssistantBackup(d){
  const src=(d.data&&typeof d.data==='object')?d.data:d;
  const wcs=src.wordCardsStructure;
  if(!wcs||typeof wcs!=='object')return null;
  const out=[],seenB=new Set();
  Object.values(wcs).forEach(g=>{
    if(g&&typeof g==='object')Object.values(g).forEach(arr=>{
      if(Array.isArray(arr))arr.forEach(x=>extractCards(x,out));
    });
  });
  const gst=src.globalStickers;
  if(gst&&typeof gst==='object')Object.values(gst).forEach(v=>{
    const lists=Array.isArray(v)?[v]:[];
    if(v&&typeof v==='object'&&!Array.isArray(v))Object.values(v).forEach(x=>{if(Array.isArray(x))lists.push(x)});
    lists.forEach(lst=>lst.forEach(x=>{
      const b=x&&x.base64;
      if(typeof b==='string'&&b.length>50&&!seenB.has(b)){
        seenB.add(b);
        const mime=b.startsWith('/9j/')?'image/jpeg':b.startsWith('iVBOR')?'image/png':b.startsWith('R0lGOD')?'image/gif':null;
        if(mime)out.push('data:'+mime+';base64,'+b);
      }
    }));
  });
  return out.length?{arr:out}:null;
}
function parseAnyCards(text){
  let d=null;
  try{d=JSON.parse(text)}catch(e){d=null}
  if(d!==null&&d!==undefined){
    if(d.v===2&&(Array.isArray(d.items)||Array.isArray(d.msgs)))return{backup:d};
    if(Array.isArray(d)){const out=[];extractCards(d,out);return{arr:out}}
    if(typeof d==='object'){
      const ab=parseAssistantBackup(d);
      if(ab){ab.src=d;return ab}
      for(const kk of['items','cards','data','list','words','msgs','messages','library','emotes','stickers','replies','keywords']){
        if(Array.isArray(d[kk])){const out=[];extractCards(d[kk],out);if(out.length)return{arr:out}}
      }
      for(const k in d){if(Array.isArray(d[k])){const out=[];extractCards(d[k],out);if(out.length)return{arr:out}}}
      const out=[];extractCards(Object.values(d),out);
      if(out.length)return{arr:out};
    }
  }
  const out=[];
  text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    if(l.startsWith('{')||l.startsWith('[')){try{const j=JSON.parse(l);extractCards(j,out);return}catch(e){}}
    if(l.includes(',')&&l.split(',').length>1&&l.length<160){l.split(/[,\t;]/).forEach(c=>{if(c.trim())out.push(c.trim())})}
    else out.push(l);
  });
  return{arr:out.filter(x=>x.length<=300)};
}
function addCards(arr,gid,owner){
  let n=0;const seen=new Set();
  arr.forEach(c=>{
    if(!c)return;
    if(isImgContent(c)){if(seen.has(c))return;seen.add(c)}
    else{c=cleanCsv(c);if(!c)return}
    S.items.push({id:uid(),kind:isImgContent(c)?'img':'text',gid,owner,content:c,fav:false});n++;
  });
  return n;
}

}

function cmUploadImages(){
  const f=$('#imgPick');f.value='';
  f.onchange=async()=>{

    let gid=CM.gid;
    if(!gid){
      let g=S.groups.find(x=>x.id==='g_stk')||S.groups.find(x=>/图片|表情/.test(x.name));

    toast(`正在处理 ${files.length} 张图片…`);
    let n=0,dup=0,fail=0;

      if(!/^image\//.test(file.type)){fail++;continue}
      const d=await new Promise(res=>{

      if(!d||!isImgContent(d)){fail++;continue}
      if(S.items.some(i=>i.kind==='img'&&i.content===d)){dup++;continue}
      S.items.push({id:uid(),kind:'img',gid,owner,content:d,fav:false});n++;
    }
    if(n){save();CM.page=120;renderCardsPg()}
    toast(n?`已添加 ${n} 张表情包 📷${dup?` · ${dup} 张重复跳过`:''}${fail?` · ${fail} 张失败`:''}`:(dup?'图片都已存在，未重复添加':(fail?'没有可用的图片':'已取消')));

  f.click();

function cmImportBackup(d){
  const total=(d.items||[]).length;
  confirmBox('检测到梦境传讯备份',`将合并其中的分组与字卡到当前字卡库（共 ${total} 条，重复内容自动跳过）`,()=>{
    let n=0;
    (d.groups||[]).forEach(g=>{if(!S.groups.some(x=>x.name===g.name))S.groups.push({id:g.id||uid(),name:g.name,icon:g.icon||'🎴'})});
    const exist=new Set(S.items.map(i=>i.gid+'¦'+i.content));
    (d.items||[]).forEach(it=>{
      const c=it.content||it.text||'';
      if(!c)return;
      let gid=it.gid;
      if(!gid||!S.groups.some(g=>g.id===gid))gid=S.groups[0].id;
      const key=gid+'¦'+c;
      if(exist.has(key))return;
      exist.add(key);
      S.items.push({id:uid(),kind:it.kind||'text',gid,owner:it.owner||'common',content:c,fav:!!it.fav});n++;
    });
    save();renderCardsPg();toast(`合并导入 ${n} 张字卡 ✅`);
  },'合并导入');
}
/* 「聊天助手」备份结构化导入：保留分组与归属，跨路径与全库去重 */
function cmImportAssistant(d){
  const src=(d.data&&typeof d.data==='object'&&d.data.wordCardsStructure)?d.data:(d.wordCardsStructure?d:null);
  if(!src){toast('文件结构无法识别');return}
  const wcs=src.wordCardsStructure||{},gst=src.globalStickers||{};
  let est=0;
  Object.values(wcs).forEach(g=>{if(g&&typeof g==='object')Object.values(g).forEach(a=>{if(Array.isArray(a))est+=a.length})});
  ['mine','common','characters'].forEach(k=>{const v=gst[k];if(Array.isArray(v))est+=v.length;else if(v&&typeof v==='object')Object.values(v).forEach(x=>{if(Array.isArray(x))est+=x.length})});
  confirmBox('检测到「聊天助手」备份',`将导入其中的字卡与表情并自动分组（共 ${est} 条，重复自动跳过）`,()=>{
    let n=0;
    [['g_num','数字','🔢'],['g_kao','颜文字','(^ω^)'],['g_emoji','emoji表情','😆'],['g_stk','图片表情','🖼️'],['g_ta1','TA的台词','💬'],['g_ta2','TA的台词·专属','🎭'],['g_mystk','我的表情','📷']].forEach(g=>{if(!S.groups.some(x=>x.id===g[0]||x.name===g[1]))S.groups.push({id:g[0],name:g[1],icon:g[2]})});
    const exist=new Set(S.items.map(i=>i.gid+'¦'+i.content));
    const existImg=new Set(S.items.filter(i=>i.kind==='img').map(i=>i.content));
    const pushImg=(c,gid,owner)=>{
      if(existImg.has(c))return;existImg.add(c);
      S.items.push({id:uid(),kind:'img',gid,owner,content:c,fav:false});n++;
    };
    const pushTxt=(raw,gid,owner)=>{
      let c=raw&&(typeof raw==='string'?raw:(raw.content||raw.text))||'';
      if(typeof c!=='string'||!c)return;
      if(isImgContent(c)){pushImg(c,gid,owner);return}
      c=cleanCsv(c);if(!c)return;
      const k=gid+'¦'+c;if(exist.has(k))return;exist.add(k);
      S.items.push({id:uid(),kind:'text',gid,owner,content:c,fav:false});n++;
    };
    const pushStk=(x,gid,owner)=>{
      const b=x&&x.base64;
      if(typeof b!=='string'||b.length<50)return;
      const mime=b.startsWith('/9j/')?'image/jpeg':b.startsWith('iVBOR')?'image/png':b.startsWith('R0lGOD')?'image/gif':null;
      if(mime)pushImg('data:'+mime+';base64,'+b,gid,owner);
    };
    const cw=wcs.common||{};
    (Array.isArray(cw.numbers)?cw.numbers:[]).forEach(x=>pushTxt(x,'g_num','common'));
    (Array.isArray(cw.emoji)?cw.emoji:[]).forEach(x=>pushTxt(x,'g_kao','common'));
    (Array.isArray(cw.others)?cw.others:[]).forEach(x=>pushTxt(x,'g_ta1','char'));
    Object.values(wcs.characters||{}).forEach(a=>{if(Array.isArray(a))a.forEach(x=>pushTxt(x,'g_ta2','char'))});
    (Array.isArray(gst.mine)?gst.mine:[]).forEach(x=>pushStk(x,'g_mystk','me'));
    (Array.isArray(gst.common)?gst.common:[]).forEach(x=>pushStk(x,'g_stk','common'));
    Object.values(gst.characters||{}).forEach(a=>{if(Array.isArray(a))a.forEach(x=>pushStk(x,'g_stk','common'))});
    save();renderCardsPg();toast(`导入 ${n} 张字卡与表情 ✅`);
  },'导入');
}

function renderCal(){
  const y=calCur.getFullYear(),m=calCur.getMonth();
  const startDow=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const evDates=new Set(S.events.map(e=>e.date));
  let cells='';
  for(let i=0;i<42;i++){
    const dn=i-startDow+1;let ds,dim=false,label=dn;
    if(dn<1){ds=todayStr(new Date(y,m-1,prevDays+dn));dim=true;label=prevDays+dn}
    else if(dn>days){ds=todayStr(new Date(y,m+1,dn-days));dim=true;label=dn-days}
    else ds=todayStr(new Date(y,m,dn));
    cells+=`<button class="cal-cell ${dim?'dim':''} ${ds===todayStr()?'today':''} ${ds===calSel?'sel':''}" onclick="app.calPick('${ds}')">${label}${evDates.has(ds)?'<span class="cal-dot"></span>':''}</button>`;
  }

  $('#subBody').innerHTML=`

    <div class="cal-head"><button class="cal-nav" onclick="app.calMove(-1)">‹</button><h4>${y}年${m+1}月</h4><button class="cal-nav" onclick="app.calMove(1)">›</button></div>
    <div class="cal-week">${'日一二三四五六'.split('').map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
  </div>
  <div class="card">
    <div class="sec-title">📌 ${calSel} 的节日备忘<span class="st-r"><button class="btn sm primary" onclick="app.evAdd()">＋ 添加</button></span></div>
    ${evs.length?evs.map(e=>`<div class="evcard"><button class="evx" onclick="app.evDel('${esc(e.date)}','${e.id}')">✕</button><h5>${esc(e.title)}</h5><p>${esc(e.text||'')}</p></div>`).join(''):'<p class="mut tc" style="padding:8px 0">这一天还没有备忘<br>点击「＋ 添加」写点什么吧</p>'}

function setTheme(id){applyTheme(id);renderSettingsPg()}
function setSet(k,v){
  S.settings[k]=v;save();
  const el=$('#sv-'+k);
  if(el){
    if(k==='replyDelay')el.textContent=v===0?'立即回复':(v>=60?`${Math.floor(v/60)}分${v%60?v%60+'秒':''}`:v+'秒');
    if(k==='replyCount')el.textContent=`1 ~ ${v} 条`;
    if(k==='letterHours')el.textContent=`≤ ${v} 小时`;
    if(k==='letterParts')el.textContent=`1 ~ ${v} 条`;
    if(k==='proactiveGap')el.textContent=`约 ${v} 小时`;
  }
}
function setProactive(){
  S.settings.proactive=!S.settings.proactive;
  if(S.settings.proactive)scheduleProactive();else S.settings.nextProactive=0;
  save();renderSettingsPg();
  toast(S.settings.proactive?'TA 会不定期主动写信给你 💌':'已关闭主动寄信');

function applyFontUrl(){
  const u=$('#fontUrl').value.trim();
  if(u&&!/^https?:\/\//.test(u)){toast('请粘贴 http(s) 开头的 CSS 链接');return}
  S.settings.fontUrl=u;applyFont();save();
  toast(u?'字体已应用 ✨':'已恢复默认字体');
}
function clearFont(){S.settings.fontUrl='';applyFont();save();renderSettingsPg();toast('已恢复默认字体')}

/* ============ 数据管理 ============ */
const MODULES=[
 ['chat','💬','聊天记录',d=>({v:2,app:'dreamtx',module:'chat',data:d.msgs}),d=>{if(!Array.isArray(d.data))throw 0;S.msgs=d.data}],
 ['cards','🎴','字卡·表情库',d=>({v:2,app:'dreamtx',module:'cards',data:{groups:d.groups,items:d.items}}),d=>{if(!d.data||!Array.isArray(d.data.items)||!Array.isArray(d.data.groups))throw 0;S.groups=d.data.groups;S.items=d.data.items}],
 ['letters','💌','电子信',d=>({v:2,app:'dreamtx',module:'letters',data:d.letters}),d=>{if(!Array.isArray(d.data))throw 0;S.letters=d.data}],
 ['feed','🌷','朋友圈',d=>({v:2,app:'dreamtx',module:'feed',data:d.feed}),d=>{if(!Array.isArray(d.data))throw 0;S.feed=d.data}],
 ['mood','🌈','心情·状态·天气',d=>({v:2,app:'dreamtx',module:'mood',data:{moods:d.moods,status:d.status,weather:d.weather}}),d=>{if(!d.data||!d.data.moods)throw 0;S.moods=d.data.moods;S.status=d.data.status||S.status;S.weather=d.data.weather||S.weather}],
 ['calendar','📅','节日日历',d=>({v:2,app:'dreamtx',module:'calendar',data:d.events}),d=>{if(!Array.isArray(d.data))throw 0;S.events=d.data}],
 ['profile','👤','双方资料',d=>({v:2,app:'dreamtx',module:'profile',data:{me:d.me,char:d.char}}),d=>{if(!d.data||!d.data.me||!d.data.char)throw 0;S.me=d.data.me;S.char=d.data.char}]
];
async function pgBackup(){
  let usage=0,quota=0,persisted=false;
  try{if(navigator.storage){const e=await navigator.storage.estimate();usage=e.usage||0;quota=e.quota||0;if(navigator.storage.persisted)persisted=await navigator.storage.persisted()}}catch(e){}
  const pct=quota?Math.max(1,Math.min(100,usage/quota*100)):0;
  $('#subBody').innerHTML=`
  <div class="card"><div class="sec-title">💾 存储空间<span class="st-r">${DB.ok?'IndexedDB 模式':'本地存储模式'}</span></div>
    <p class="mut">已使用 <b style="color:var(--ink)">${bytes(usage)}</b>${quota?` / 可用约 ${bytes(quota)}`:' · 浏览器按需分配，无固定上限'}</p>
    <div class="store-bar"><i style="width:${pct}%"></i></div>
    ${persisted?'<p class="hint">✅ 已开启持久化存储，系统不会自动清理你的数据</p>':'<p class="hint">提示：常用此页面并添加到主屏幕，可降低数据被系统清理的概率。</p>'}
  </div>
  <div class="card"><div class="sec-title">📦 整体备份</div>
    <div class="row" style="flex-wrap:wrap;gap:8px">
      <button class="btn primary sm" onclick="app.fullExport()">📤 导出全部数据</button>
      <button class="btn sm" onclick="app.fullImport()">📥 导入全部数据</button>
      <button class="btn sm danger" onclick="app.resetAll()">🗑 清空重置</button>
    </div>
    <p class="hint">导出的 JSON 包含聊天、字卡、信件、说说等全部内容，可留作备份或换机迁移。</p>
  </div>
  <div class="card"><div class="sec-title">🧩 按模块备份 / 恢复</div>
    ${MODULES.map(([k,ic,nm])=>`<div class="mod-row"><span class="mod-ic">${ic}</span><span class="mod-name">${nm}<small>${modCount(k)} 条数据</small></span>
      <button class="btn sm" onclick="app.modExp('${k}')">📤</button>
      <button class="btn sm" onclick="app.modImp('${k}')">📥</button></div>`).join('')}
    <p class="hint">导入模块会替换该模块当前内容，请谨慎操作。</p>
  </div>`;
}
function modCount(k){
  const c={chat:()=>S.msgs.length,cards:()=>S.items.length,letters:()=>S.letters.length,feed:()=>S.feed.length,mood:()=>S.moods.me.length+S.moods.char.length,calendar:()=>S.events.length,profile:()=>2};
  return c[k]?c[k]():0;
}
function fullExport(){
  downloadFile(`梦境传讯-完整备份-${todayStr()}.json`,JSON.stringify({...S,pending:{chat:null,letters:[],feed:[]}},null,1));
  toast('完整备份已导出 📤');
}
function fullImport(){
  pickDataFile(text=>{
    let d;try{d=JSON.parse(text)}catch(e){toast('文件不是有效的 JSON');return}
    if(d.v!==2||(!Array.isArray(d.items)&&!Array.isArray(d.msgs))){toast('这不是有效的备份文件（需要 v2 格式）');return}
    confirmBox('导入完整备份？','将覆盖当前全部数据（聊天、字卡、信件等）',async()=>{
      S=ensureShape(d);await saveNow();location.reload();
    },'覆盖导入');
  });
}
function modExp(k){
  const m=MODULES.find(x=>x[0]===k);
  downloadFile(`梦境传讯-${m[2]}-${todayStr()}.json`,JSON.stringify(m[3](S),null,1));
  toast(`${m[2]} 已导出 📤`);
}
function modImp(k){
  const m=MODULES.find(x=>x[0]===k);
  pickDataFile(text=>{
    let d;try{d=JSON.parse(text)}catch(e){toast('文件不是有效的 JSON');return}
    if(d.module!==k||d.v!==2){toast(`这不是「${m[2]}」模块的备份`);return}
    confirmBox(`导入「${m[2]}」？`,'将替换该模块的当前内容',()=>{
      try{m[4](d)}catch(e){toast('文件格式不正确');return}
      save();refreshAll();pgBackup();toast('模块已导入 ✅');
    },'替换');
  });
}
function resetAll(){
  confirmBox('清空所有数据？','所有聊天、字卡、信件、说说将全部删除，无法恢复！',()=>{
    confirmBox('再次确认','真的要全部清空吗？建议先导出备份',async()=>{
      await DB.del(DKEY);
      try{localStorage.removeItem('dreamtx_data_v1')}catch(e){}
      location.reload();
    },'确认清空');
  },'仍要清空');
}
function refreshAll(){
  applyHeader();applyChbar();renderMsgs();renderFeed();renderLetters();updateBadges();
}

/* ============ 每日随机更新 ============ */
function dailyUpdate(){
  const today=todayStr();
  if(S.lastOpen===today)return;
  S.lastOpen=today;
  const note=[];
  if(Math.random()<.4){S.status.char={text:pick(CHAR_STATUS_POOL),emoji:pick(['💭','🌙','✨','🎶','🧋','📖','🎧','🌸'])};note.push('状态')}
  if(Math.random()<.4){const m=pick(CHAR_MOOD_POOL);S.moods.char.unshift({emoji:m.e,text:m.t,ts:Date.now()});S.moods.char=S.moods.char.slice(0,60);note.push('心情')}
  if(Math.random()<.3){const w=pick(WEATHER_POOL);S.weather={e:w.e,t:w.t,ts:Date.now()};note.push('天气')}
  save();
  if(note.length){applyHeader();setTimeout(()=>toast(`${S.char.name} 更新了${note.join('、')} ✨`),1600)}
}

/* ============ 加载页 ============ */
const LOAD_HINTS=['在梦里，我们见过无数次','有些话，隔着屏幕也想说给你听','今天也要记得想我哦','花瓣落在信纸上，变成了思念','月亮是夜晚的邮差','把心事折成纸飞机，飞向你','风替我拥抱了你','我们的故事，未完待续…'];
function initLoading(migrated,firstRun){
  const glyphs=['🌸','❀','✦','✧','🌷','⋆','🌸','✦'];
  let h='';
  for(let i=0;i<24;i++){
    const g=glyphs[i%glyphs.length];
    const star=/^[✦✧⋆]$/.test(g);
    h+=`<span class="petal ${star?'star':''}" style="left:${rnd(0,100)}%;font-size:${rnd(11,26)}px;animation-duration:${rnd(7,16)}s;animation-delay:-${rnd(0,14)}s">${g}</span>`;
  }
  $('#lsDeco').innerHTML=h;
  let hi=0;const hintEl=$('#lsHint');hintEl.textContent=LOAD_HINTS[0];
  const hintTimer=setInterval(()=>{hi=(hi+1)%LOAD_HINTS.length;hintEl.textContent=LOAD_HINTS[hi]},2800);
  $('#lpBtn').addEventListener('click',()=>{
    clearInterval(hintTimer);
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    $('#loadingScreen').classList.add('off');
    $('#app').classList.remove('hidden');
    setTimeout(()=>{$('#loadingScreen').style.display='none'},700);
    if(migrated)setTimeout(()=>toast('已自动迁移旧版数据 ✅'),400);
    else if(firstRun)setTimeout(()=>toast(`欢迎回家，和 ${S.char.name} 说句话吧 💬`),400);
    save();
  },{once:true});
}

/* ============ 事件绑定 ============ */
function bindEvents(){
  const inp=$('#chatInput');
  inp.addEventListener('input',autoSize);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
  $('#modalMask').addEventListener('click',e=>{if(e.target.id==='modalMask')closeModal()});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow();else setTimeout(tick,400)});
  window.addEventListener('pagehide',saveNow);
}

/* ============ 启动 ============ */
(async function boot(){
  await DB.open();
  let st=null,migrated=false;
  try{st=await DB.get(DKEY,null)}catch(e){}
  if(!st||!st.v){
    const m=await migrateV1();
    if(m){st=m;migrated=true}
    else st=defaultState();
  }
  S=ensureShape(st);
  const firstRun=!S.msgs.length;
  document.body.className=S.settings.theme;
  applyChatBg();applyBubbles();applyFont();applyHeader();
  renderMsgs();renderFeed();renderLetters();renderFeedImgs();updateBadges();
  if(firstRun){
    S.msgs.push({id:uid(),side:'sys',kind:'text',content:`✨ 欢迎来到你与 ${S.char.name} 的小世界`,ts:Date.now(),quote:null,recalled:false,fav:false});
    S.msgs.push({id:uid(),side:'char',kind:'text',content:'你来了……(๑´ㅂ`๑) 我等你好久啦',ts:Date.now()+1,quote:null,recalled:false,fav:false});
    renderMsgs();
  }
  dailyUpdate();
  bindEvents();
  initLoading(migrated,firstRun);
  setInterval(tick,2000);
  save();
})();
